const screen=document.querySelector('#screen');
const action=document.querySelector('#action');
const answers=[];
let step=-1;
function showImage(src,alt){
  const image=new Image();image.src=src;image.alt=alt;screen.append(image);
}
function render(){
  screen.replaceChildren();
  action.className=step>=0&&step<8?'secondary':'';
  window.scrollTo(0,0);
  if(step<0){
    action.textContent='Começar quiz';
    showImage(data.landing,'Página inicial do quiz do Dr. Renato Silveira');
    screen.querySelector('img').addEventListener('click',()=>{step=0;render()});
    return;
  }
  if(step===8){
    action.textContent='Recomeçar';
    const low=answers.reduce((total,answer)=>total+answer.score,0)>=5;
    showImage(low?data.low:data.high,low?'Tela de resultado baixo':'Tela de resultado com os três kits');
    return;
  }
  action.textContent='Voltar';
  const quiz=document.createElement('section');quiz.className='quiz';
  const progress=document.createElement('progress');progress.max=8;progress.value=step+1;
  progress.setAttribute('aria-label','Progresso do quiz');
  const gender=answers[0]?.letter==='B'?'feminino':'masculino';
  const question=data[gender][step];
  const title=document.createElement('h1');title.textContent=question.prompt;
  quiz.append(progress,title);
  for(const answer of question.options){
    const button=document.createElement('button');button.className='option';
    for(const [className,text] of [['emoji',answer.emoji],['letter',answer.letter],['',answer.text]]){
      const span=document.createElement('span');span.className=className;span.textContent=text;button.append(span);
    }
    button.addEventListener('click',()=>{answers[step]=answer;step+=1;render()});
    quiz.append(button);
  }
  screen.append(quiz);
}
action.addEventListener('click',()=>{
  if(step===8){answers.length=0;step=-1}
  else if(step<0){step=0}
  else {step-=1;answers.length=Math.max(0,step)}
  render();
});
render();
</script></html>
